name: CI

# Um workflow só, sem filtro de paths no gatilho: assim os checks obrigatórios da
# proteção da main sempre reportam. Jobs sem mudanças são pulados (skip = aprovado).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - "System-Zona-Sul-Urgente-Web-Frontend/**"
              - ".github/workflows/ci.yml"
            backend:
              - "System-Zona-Sul-Urgente-Web-Backend/**"
              - ".github/workflows/ci.yml"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System-Zona-Sul-Urgente-Web-Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: System-Zona-Sul-Urgente-Web-Frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: System-Zona-Sul-Urgente-Web-Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers usa o Docker do runner para subir um PostgreSQL real.
      - run: ./mvnw -B verify
