spring:
  application:
    name: zona-sul-urgente-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zonasul}
    username: ${DB_USER:zonasul}
    password: ${DB_PASSWORD:zonasul}
  jpa:
    # Flyway é a única fonte de schema: o Hibernate só valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  # Envio de fotos (BE-012): até 10 MB por foto.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  # Worker da fila e publicação dos agendados não esperam um pelo outro.
  task:
    scheduling:
      pool:
        size: 2

logging:
  # requestId (X-Request-Id) em toda linha de log da requisição (BE-002).
  pattern:
    correlation: "[%X{requestId:-}] "

zsu:
  auth:
    # Chave AES-256 (base64) dos segredos TOTP. Gere com: openssl rand -base64 32
    totp-key: ${TOTP_ENCRYPTION_KEY:}
  # Revalidação do site após publicar/editar (BE-011). URL interna do Next + o mesmo
  # REVALIDATE_SECRET do frontend. Vazios = desligada (o site atualiza quando o cache vence).
  # Fotos (BE-012). storage: "s3" (Cloudflare R2) ou "local" (pasta servida em /media/**, só dev).
  media:
    storage: ${MEDIA_STORAGE:local}
    public-base-url: ${MEDIA_PUBLIC_URL:http://localhost:8080}
    local-dir: ${MEDIA_LOCAL_DIR:media-local}
    s3:
      endpoint: ${MEDIA_S3_ENDPOINT:}
      bucket: ${MEDIA_S3_BUCKET:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
  site:
    revalidate-url: ${SITE_REVALIDATE_URL:}
    revalidate-secret: ${REVALIDATE_SECRET:}
  # Primeiro administrador de um servidor novo (sem Admin ativo): cria o convite e mostra o link no log.
  # Vazio = desligado. Com um Admin ativo, é ignorado.
  bootstrap:
    admin:
      email: ${ZSU_BOOTSTRAP_ADMIN_EMAIL:}
      name: ${ZSU_BOOTSTRAP_ADMIN_NAME:Administrador Zona Sul}
      site-url: ${ZSU_SITE_URL:}
  # Conta do Instagram (BE-013, spec 001). O acesso é colado no painel e fica cifrado no banco (sem variável aqui).
  # Padrões em InstagramProperties: varredura a cada 15 min, posts dos últimos 7 dias na conexão, conferência de
  # legenda alterada/post apagado nos últimos 30 dias, aviso após 3 falhas seguidas.
  instagram:
    graph-base-url: https://graph.facebook.com/v27.0
    sync-interval: 15m
  # IA editorial (BE-014). provider: "gemini" ou "fake" (sem rede, para testes e dev sem chave).
  # Plano grátis do Gemini: só conteúdo público (ARCHITECTURE §6).
  ai:
    provider: ${AI_PROVIDER:fake}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.7-flash}
      # Usado quando o principal não responde (tempo esgotado ou sobrecarga). Vazio = sem reserva.
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}

  # Monitor de uso dos planos gratuitos (spec 004). Limites de referência do plano grátis — configuráveis
  # (FR-013). Recurso fora desta lista não aparece nem trava. lock-at = % em que trava (sem ele, só aviso).
  # A Cloudflare (números reais do R2) precisa de um token SÓ DE LEITURA ("Account Analytics: Read") no .env.
  usage:
    refresh: ${USAGE_REFRESH:30m}
    warn-at: 70
    critical-at: 90
    cloudflare:
      account-id: ${CLOUDFLARE_ACCOUNT_ID:}
      api-token: ${CLOUDFLARE_ANALYTICS_TOKEN:}
    resources:
      "[fotos.espaco]": { label: "Fotos — espaço guardado", unit: BYTES, limit: 10737418240, period: NONE,
                          meter: CLOUDFLARE_R2_STORAGE, lock-at: 95, order: 1 }
      "[fotos.gravacoes]": { label: "Fotos — gravações no mês", unit: OPERATIONS, limit: 1000000, period: MONTH,
                             meter: CLOUDFLARE_R2_CLASS_A, lock-at: 95, order: 2 }
      "[fotos.leituras]": { label: "Fotos — leituras no mês", unit: OPERATIONS, limit: 10000000, period: MONTH,
                            meter: CLOUDFLARE_R2_CLASS_B, order: 3 }
      "[disco]": { label: "Disco do servidor", unit: BYTES, period: NONE, meter: DISK, order: 9 }

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

---
spring:
  config:
    activate:
      on-profile: local
  # Dados de exemplo (gerados dos mocks do frontend). Só neste perfil, nunca em produção.
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Chave de desenvolvimento (só no perfil local). Em produção: TOTP_ENCRYPTION_KEY.
zsu:
  auth:
    totp-key: ${TOTP_ENCRYPTION_KEY:bG9jYWwtZGV2LW9ubHktdG90cC1rZXktMzJieXRlcyE=}
  # next dev na porta 3000; o .env.local do frontend usa o mesmo segredo de desenvolvimento.
  site:
    revalidate-url: ${SITE_REVALIDATE_URL:http://localhost:3000}
    revalidate-secret: ${REVALIDATE_SECRET:dev-only-revalidate-secret-nao-usar-em-producao}

---
spring:
  config:
    activate:
      on-profile: prod

# Fotos sempre no R2 em produção (MEDIA_PUBLIC_URL = https://media.<dominio>).
zsu:
  media:
    storage: ${MEDIA_STORAGE:s3}
  # Sem GEMINI_API_KEY a API não sobe em produção (nunca a IA falsa por engano).
  ai:
    provider: ${AI_PROVIDER:gemini}
  # Cota da IA por modelo (spec 004): principal e reserva têm cotas separadas no Gemini. Sem os valores, aparecem em
  # vermelho como "Sem limite configurado" e a geração espera (análise G1) — preencha USAGE_AI_* no .env.
  usage:
    resources:
      "[ia.principal.minuto]": { label: "IA principal — pedidos no minuto", unit: REQUESTS,
                                 limit: "${USAGE_AI_MAIN_RPM:}", period: MINUTE, lock-at: 100, require-limit: true,
                                 order: 4 }
      "[ia.principal.dia]": { label: "IA principal — pedidos no dia", unit: REQUESTS, limit: "${USAGE_AI_MAIN_RPD:}",
                              period: DAY_PACIFIC, lock-at: 100, require-limit: true, order: 5 }
      "[ia.reserva.minuto]": { label: "IA reserva — pedidos no minuto", unit: REQUESTS,
                               limit: "${USAGE_AI_FALLBACK_RPM:}", period: MINUTE, lock-at: 100, require-limit: true,
                               order: 6 }
      "[ia.reserva.dia]": { label: "IA reserva — pedidos no dia", unit: REQUESTS,
                            limit: "${USAGE_AI_FALLBACK_RPD:}", period: DAY_PACIFIC, lock-at: 100,
                            require-limit: true, order: 7 }

# Em produção a documentação da API não fica pública.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
