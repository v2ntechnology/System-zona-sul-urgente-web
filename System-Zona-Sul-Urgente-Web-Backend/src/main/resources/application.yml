spring:
  application:
    name: zona-sul-urgente-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zonasul}
    username: ${DB_USER:zonasul}
    password: ${DB_PASSWORD:zonasul}
  jpa:
    # Flyway é a única fonte de schema: o Hibernate só valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  # Worker da fila e publicação dos agendados não esperam um pelo outro.
  task:
    scheduling:
      pool:
        size: 2

logging:
  # requestId (X-Request-Id) em toda linha de log da requisição (BE-002).
  pattern:
    correlation: "[%X{requestId:-}] "

zsu:
  auth:
    # Chave AES-256 (base64) dos segredos TOTP. Gere com: openssl rand -base64 32
    totp-key: ${TOTP_ENCRYPTION_KEY:}
  # Revalidação do site após publicar/editar (BE-011). URL interna do Next + o mesmo
  # REVALIDATE_SECRET do frontend. Vazios = desligada (o site atualiza quando o cache vence).
  site:
    revalidate-url: ${SITE_REVALIDATE_URL:}
    revalidate-secret: ${REVALIDATE_SECRET:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

---
spring:
  config:
    activate:
      on-profile: local
  # Dados de exemplo (gerados dos mocks do frontend). Só neste perfil, nunca em produção.
  flyway:
    locations: classpath:db/migration,classpath:db/seed

# Chave de desenvolvimento (só no perfil local). Em produção: TOTP_ENCRYPTION_KEY.
zsu:
  auth:
    totp-key: ${TOTP_ENCRYPTION_KEY:bG9jYWwtZGV2LW9ubHktdG90cC1rZXktMzJieXRlcyE=}
  # next dev na porta 3000; o .env.local do frontend usa o mesmo segredo de desenvolvimento.
  site:
    revalidate-url: ${SITE_REVALIDATE_URL:http://localhost:3000}
    revalidate-secret: ${REVALIDATE_SECRET:dev-only-revalidate-secret-nao-usar-em-producao}

---
spring:
  config:
    activate:
      on-profile: prod

# Em produção a documentação da API não fica pública.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
